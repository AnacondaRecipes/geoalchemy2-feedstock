{% set name = "GeoAlchemy2" %}
{% set version = "0.20.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: 450f427f4bc3cf2d5ddee0af3763aed0f3eea2384e7c9a99798d8f1508279322

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=61
    - setuptools-scm >=6.2
  run:
    - python
    - sqlalchemy >=1.4
    - packaging
  run_constrained:
    - Shapely >=1.7

test:
  imports:
    - geoalchemy2
    - geoalchemy2.admin
    - geoalchemy2.admin.dialects
    - geoalchemy2.types
    - geoalchemy2.types.dialects
  source_files:
    - tests
  requires:
    - pip
    - pytest
    - shapely >=1.7
    - alembic
    - rasterio
  commands:
    - pip check
    # Skipping failing benchamark tests as they require whole infrastructure.
    # They're not critical eitherway.
    - pytest -v tests --ignore=tests/benchmarks/test_insert_select.py  # [unix]
    # For Windows, skip as well a failing test because of a problem
    # with decoding sign UTF-8 0xC3 0xA9 (é)
    - pytest -v tests --ignore=tests/benchmarks/test_insert_select.py -k "not test_stubs_up_to_date"  # [win]

about:
  home: https://geoalchemy.org
  license: MIT
  license_family: MIT
  license_file: COPYING.rst
  summary: Using SQLAlchemy with Spatial Databases
  description: |
    GeoAlchemy 2 is a support library for SQLAlchemy, that adds support for spatial databases.
  doc_url: https://geoalchemy-2.readthedocs.io
  dev_url: https://github.com/geoalchemy/geoalchemy2

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf
